[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halloween-osint-2026"
version = "0.1.0"
description = "Local-first evidence integrity, passive infrastructure observation, and offline transaction analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MrCakes" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
halloween-osint = "halloween_osint.cli:main"
halloween-osint-mcp = "halloween_osint.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
