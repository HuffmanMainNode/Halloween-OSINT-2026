name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: bandit -q -r src

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/halloween-wheel
          /tmp/halloween-wheel/bin/python -m pip install dist/*.whl
          /tmp/halloween-wheel/bin/halloween-osint --help
      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/halloween-sdist
          /tmp/halloween-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/halloween-sdist/bin/halloween-osint --help
