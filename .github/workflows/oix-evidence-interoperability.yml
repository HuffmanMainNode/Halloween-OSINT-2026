name: OIX evidence interoperability

on:
  push:
    branches:
      - integration/oix-evidence-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oix-evidence-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Halloween OSINT
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Open Intelligence Exchange at a reviewed commit
        uses: actions/checkout@v4
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: f2c2326675bf881b6195c5f761b628da6579fe38
          path: Open-Intelligence-Exchange
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OIX and Halloween OSINT
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Open-Intelligence-Exchange
          python -m pip install -e ".[dev]"
      - name: Run OIX bridge tests
        run: pytest tests/test_oix_bridge.py
      - name: Run synthetic signed-evidence demonstration
        run: python examples/oix_evidence_bridge_demo.py
      - name: Run Halloween OSINT quality checks
        run: |
          pytest
          ruff check .
          bandit -q -r src
